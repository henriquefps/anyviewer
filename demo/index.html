<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AnyViewer Demo</title>
  <meta name="description" content="Document previewer that runs in the browser: images, PDF, Excel and CSV, Word, ZIP archives, text and code, Markdown, HTML, audio and video.">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <!-- Only the core is loaded up front; each library is fetched the first time a file type needs it -->
  <script src="../dist/anyviewer.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="brand">
        <div class="brand-name">
          <img src="../assets/icon.svg" alt="" width="36" height="36">
          <div>
            <h1>AnyViewer</h1>
            <p data-t="tagline"></p>
          </div>
        </div>
        <div class="brand-tools">
          <select id="lang" aria-label="Language">
            <option value="en">EN</option>
            <option value="pt">PT</option>
          </select>
          <a class="gh" href="https://github.com/henriquefps/anyviewer" target="_blank" rel="noopener" aria-label="GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          </a>
        </div>
      </header>

      <nav class="scenarios" id="scenarios" aria-label="Scenarios"></nav>

      <section class="panel" id="panel" aria-live="polite"></section>

      <details class="log" id="log-box">
        <summary><span data-t="events"></span> <span class="count" id="log-count">0</span></summary>
        <div class="log-tools">
          <button type="button" id="log-clear" data-t="clearLog"></button>
        </div>
        <ol id="log"></ol>
      </details>

      <footer class="credits" data-t-html="credits"></footer>
    </aside>

    <main class="stage" id="stage">
      <div id="viewer" class="viewer"></div>
      <div class="drop" id="drop" hidden><span data-t="dropHere"></span></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
