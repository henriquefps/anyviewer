<!doctype html>
<html><head><meta charset="utf-8"><title>AnyViewer block preview</title>
<!-- Source of block-preview.png: the viewer's own CSS (anyviewer.js), static markup -->
<script src="../src/anyviewer.js"></script>
<style>
  html,body{margin:0;background:transparent;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #shot{width:960px;padding:0}
  .page{width:420px;height:420px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:36px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px}
  .pic{height:170px;border-radius:10px;position:relative;overflow:hidden;background:#cfe0fc}
  .pic svg{position:absolute;inset:0;width:100%;height:100%}
  .ln{height:16px;border-radius:8px;background:#adb5bd}
  .hint{position:absolute;right:18px;bottom:14px;font-size:13px;color:#6a7178}
</style></head><body>
<div id="probe" style="display:none"></div>
<div id="shot">
  <div class="av" style="height:540px">
    <div class="av-bar">
      <span class="av-name">AnyViewer</span>
      <span class="av-badge">PDF · XLSX · DOCX · ZIP · IMG · …</span>
      <div class="av-tools">
        <span class="av-info">Page 1 / 3</span>
        <button class="av-btn" type="button">&minus;</button>
        <span class="av-info">100%</span>
        <button class="av-btn" type="button">+</button>
      </div>
      <div class="av-tools">
        <button class="av-btn" type="button">&#x2913;</button>
        <button class="av-btn" type="button">&#x26F6;</button>
      </div>
    </div>
    <div class="av-body">
      <div class="av-pdf" style="min-height:100%;box-sizing:border-box;padding-top:24px">
        <div class="page">
          <div class="pic"><svg viewBox="0 0 340 170" preserveAspectRatio="none">
            <circle cx="270" cy="44" r="22" fill="#fff"/>
            <path d="M-10 180 L110 70 L170 125 L215 88 L350 180 Z" fill="#1068eb"/>
          </svg></div>
          <div class="ln" style="width:100%"></div>
          <div class="ln" style="width:86%"></div>
          <div class="ln" style="width:94%"></div>
          <div class="ln" style="width:58%"></div>
        </div>
      </div>
      <span class="hint">Document preview · binary or URL</span>
    </div>
  </div>
</div>
<script>
  // Injects the viewer CSS (ensureCss runs on the first render)
  AnyViewer.render("probe", {});
</script>
</body></html>
